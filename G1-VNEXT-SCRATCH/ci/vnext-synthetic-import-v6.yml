name: SYLPH G1 vNext isolated synthetic maintenance

on:
  workflow_dispatch:
  push:
    branches:
      - codex/g1-vnext-synthetic-import-scratch
    paths:
      - 'G1-VNEXT-SCRATCH/broker/**'
      - '.github/workflows/g1-vnext-synthetic-import.yml'

permissions:
  contents: read

concurrency:
  group: sylph-g1-vnext-scratch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-scratch:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout selected scratch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt --target x86_64-pc-windows-msvc
          rustup default 1.89.0
          rustc --version --verbose
          cargo --version

      - name: Run default and feature-gated regression suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = 'G1-VNEXT-SCRATCH/broker/Cargo.toml'
          cargo fmt --manifest-path $manifest -- --check
          cargo test --locked --manifest-path $manifest --target x86_64-pc-windows-msvc -- --test-threads=1
          cargo test --locked --manifest-path $manifest --target x86_64-pc-windows-msvc --features synthetic-maintenance --bin g1-synthetic-maintenance -- --test-threads=1
          cargo test --locked --manifest-path $manifest --target x86_64-pc-windows-msvc --features synthetic-maintenance --bin g1-broker -- --test-threads=1
          cargo test --locked --manifest-path $manifest --target x86_64-pc-windows-msvc --features synthetic-maintenance --bin g1-client -- --test-threads=1
          cargo build --locked --release --bins --manifest-path $manifest --target x86_64-pc-windows-msvc
          cargo build --locked --release --bins --manifest-path $manifest --target x86_64-pc-windows-msvc --features synthetic-maintenance

      - name: Upload sanitized source build records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sylph-g1-vnext-scratch-${{ github.run_id }}
          path: |
            G1-VNEXT-SCRATCH/broker/Cargo.lock
            G1-VNEXT-SCRATCH/broker/SYNTHETIC-MAINTENANCE.md
          if-no-files-found: error
          retention-days: 30
