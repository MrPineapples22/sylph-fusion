name: SYLPH Safety & Verification CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**.md'
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    name: Platform & Intelligence Safety Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix terminal ci

      - name: Build Engine & UI
        run: |
          npm run build:engine
          npm run build:ui

      - name: Run Comprehensive Test Suite
        run: |
          npm run test:core
          npm run test:intelligence
          npm run test:platform
          npm run test:terminal
