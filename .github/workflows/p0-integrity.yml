name: P0 evidence integrity (paper only)
on:
  push:
    branches: [main, 'fix/p0-*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Restore locked dependencies
        run: npm ci
      - name: Compile Engine
        run: npm run build:engine
      - name: P0 integrity regressions
        run: node --test --test-isolation=none test/platform/p0-integrity.test.mjs
      - name: Existing project test suites
        run: npm run test:all
      - name: Keep release authority blocked
        run: |
          grep -q 'PRODUCTION RELEASE BLOCKED' ARCHITECTURE_GAPS.md
          grep -q 'UNVERIFIED CANDIDATE' RELEASE_CERTIFICATION.md
