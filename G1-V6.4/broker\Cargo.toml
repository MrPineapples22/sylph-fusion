[package]
name = "sylph-g1-broker"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled", "limits", "load_extension"] }

[[bin]]
name = "g1-broker"
path = "src/bin/g1-broker.rs"

[[bin]]
name = "g1-client"
path = "src/bin/g1-client.rs"

[[bin]]
name = "g1-attacker"
path = "src/bin/g1-attacker.rs"

[[bin]]
name = "g1-verifier"
path = "src/bin/g1-verifier.rs"
