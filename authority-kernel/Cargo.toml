[package]
name = "authority-kernel"
version = "0.1.0"
edition = "2021"
authors = ["SYLPH Engineering <engineering@sylph-fusion.local>"]
description = "Deterministic, formal-methods verified authority microkernel for SYLPH FUSION economic control"

[dependencies]
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
proptest = "1.4"

[profile.dev]
codegen-units = 1

[profile.test]
codegen-units = 1

