[package]
name = "sylph-v15-litesvm-runner"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
litesvm = "=0.18.0"
solana-account = "3"
solana-address = "2"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "3"
solana-signer = "3"
solana-transaction = "3"
solana-system-interface = { version = "2", features = ["bincode"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
